<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Capacitor Ferrostar Navigation</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"
    ></script>
    <script
      nomodule
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css"
    />

    <script type="module" src="./js/script.js"></script>
  </head>
  <body>
    <ion-app>
      <ion-header>
        <ion-toolbar>
          <ion-title>Capacitor Ferrostar Navigation</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-list>
          <ion-item>
            <ion-toggle id="simulate-location-toggle" checked
              >Simulate location</ion-toggle
            >
          </ion-item>
          <ion-item>
            <ion-toggle id="continue-in-background-toggle"
              >Continue in background</ion-toggle
            >
          </ion-item>
          <ion-button id="start-navigation-button" expand="block"
            >Start Navigation</ion-button
          >
          <ion-button id="replace-route-button" expand="block"
            >Replace Route</ion-button
          >
          <ion-button id="stop-navigation-button" expand="block"
            >Stop Navigation</ion-button
          >
          <ion-button id="mute-voice-button" expand="block"
            >Mute Voice</ion-button
          >
          <ion-button id="unmute-voice-button" expand="block"
            >Unmute Voice</ion-button
          >
        </ion-list>
        <ion-card>
          <ion-card-header>
            <ion-card-title id="status-text">IDLE</ion-card-title>
            <ion-card-subtitle id="instruction-text"></ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p id="progress-text"></p>
            <p id="location-text"></p>
          </ion-card-content>
        </ion-card>
      </ion-content>
    </ion-app>
  </body>
</html>
