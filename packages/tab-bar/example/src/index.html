<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Capacitor Tab Bar</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <style>
      :root {
        color-scheme: light dark;
        --background: #f2f2f7;
        --surface: #ffffff;
        --text: #000000;
        --text-secondary: #6e6e73;
        --accent: #007aff;
        --accent-background: rgba(0, 122, 255, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #000000;
          --surface: #1c1c1e;
          --text: #ffffff;
          --text-secondary: #98989f;
          --accent: #0a84ff;
          --accent-background: rgba(10, 132, 255, 0.2);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          calc(env(safe-area-inset-bottom) + 16px) env(safe-area-inset-left);
        background: var(--background);
        color: var(--text);
        font:
          17px -apple-system,
          system-ui,
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      header {
        padding: 16px 20px 8px;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        font-weight: 700;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 700;
      }

      header p {
        margin: 4px 0 0;
        color: var(--text-secondary);
      }

      section {
        padding: 12px 16px;
      }

      .card {
        padding: 16px;
        border-radius: 20px;
        background: var(--surface);
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        padding: 8px 14px;
        border: 0;
        border-radius: 999px;
        background: var(--accent-background);
        color: var(--accent);
        font: 600 15px -apple-system;
      }

      .meta {
        margin: 12px 0 0;
        color: var(--text-secondary);
        font-size: 13px;
      }

      #log {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        font:
          13px ui-monospace,
          Menlo,
          monospace;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .tile {
        display: flex;
        align-items: flex-end;
        aspect-ratio: 1;
        padding: 12px;
        border-radius: 20px;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
      }

      #probe {
        position: fixed;
        visibility: hidden;
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
    <script type="module" src="./js/script.js"></script>
  </head>
  <body>
    <div id="probe"></div>
    <header>
      <h1>Tab Bar</h1>
      <p>Native tab bar with Liquid Glass on iOS.</p>
    </header>
    <section>
      <div class="card">
        <h2>Controls</h2>
        <div class="buttons">
          <button id="show">Show</button>
          <button id="hide">Hide</button>
          <button id="increase-badge">Increase badge</button>
          <button id="clear-badge">Clear badge</button>
          <button id="select-search">Select Search</button>
          <button id="set-colors">Set colors</button>
          <button id="reset-colors">Reset colors</button>
        </div>
        <p class="meta">Bottom safe area inset: <span id="inset">0</span>px</p>
        <ul id="log"></ul>
      </div>
    </section>
    <section>
      <h2>Gallery</h2>
      <div class="gallery" id="gallery"></div>
    </section>
  </body>
</html>
