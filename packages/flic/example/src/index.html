<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Capacitor Flic</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"
    ></script>
    <script
      nomodule
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css"
    />

    <script type="module" src="./js/script.js"></script>
  </head>
  <body>
    <ion-app>
      <ion-header>
        <ion-toolbar>
          <ion-title>Flic</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-button id="initialize" expand="block">Initialize</ion-button>
        <ion-button id="checkPermissions" expand="block"
          >Check Permissions</ion-button
        >
        <ion-button id="requestPermissions" expand="block"
          >Request Permissions</ion-button
        >
        <ion-button id="startScan" expand="block">Start Scan</ion-button>
        <ion-button id="stopScan" expand="block">Stop Scan</ion-button>
        <ion-button id="getButtons" expand="block">Get Buttons</ion-button>
        <ion-item>
          <ion-input id="buttonId" label="Button ID"></ion-input>
        </ion-item>
        <ion-button id="connectButtonById" expand="block"
          >Connect Button</ion-button
        >
        <ion-button id="disconnectButtonById" expand="block"
          >Disconnect Button</ion-button
        >
        <ion-button id="forgetButtonById" expand="block"
          >Forget Button</ion-button
        >
      </ion-content>
    </ion-app>
  </body>
</html>
