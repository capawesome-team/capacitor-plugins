appId: com.example.plugin
name: Download a manifest bundle via the form without launching the app
---
- extendedWaitUntil:
    visible: "Artifact Type"
    timeout: 20000
- tapOn: "Artifact Type"
- tapOn: "Manifest"
- tapOn: "OK"
- runFlow:
    file: _tap-input.yaml
    env:
      INPUT_ID: bundle-id-input
      INPUT_LABEL: Bundle ID
- inputText: ${BUNDLE_ID}
- runFlow: _dismiss-keyboard.yaml
- runFlow:
    file: _tap-input.yaml
    env:
      INPUT_ID: download-url-input
      INPUT_LABEL: Download URL
- inputText: ${URL}
- runFlow: _dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      text: "Download Bundle"
- tapOn: "Download Bundle"
