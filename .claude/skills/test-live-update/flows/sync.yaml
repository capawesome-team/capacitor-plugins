appId: com.example.plugin
name: Sync (clears app state first)
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Capacitor Live Update"
    timeout: 10000
- runFlow:
    file: _tap-input.yaml
    env:
      INPUT_ID: channel-input
      INPUT_LABEL: Channel
- inputText: "${typeof CHANNEL !== 'undefined' ? CHANNEL : 'default'}"
- runFlow: _dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      text: "Sync"
- tapOn: "Sync"
