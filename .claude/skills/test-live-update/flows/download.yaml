appId: com.example.plugin
name: Download a bundle via the form, optionally expecting an error toast
---
- launchApp
- extendedWaitUntil:
    visible: "Capacitor Live Update"
    timeout: 10000
- runFlow:
    file: _tap-input.yaml
    env:
      INPUT_ID: bundle-id-input
      INPUT_LABEL: Bundle ID
- inputText: "${typeof BUNDLE_ID !== 'undefined' ? BUNDLE_ID : 'test-bundle'}"
- runFlow: _dismiss-keyboard.yaml
- runFlow:
    when:
      true: ${typeof CHECKSUM !== 'undefined' && CHECKSUM != ''}
    commands:
      - runFlow:
          file: _tap-input.yaml
          env:
            INPUT_ID: checksum-input
            INPUT_LABEL: Checksum
      - inputText: ${CHECKSUM}
      - runFlow: _dismiss-keyboard.yaml
- runFlow:
    file: _tap-input.yaml
    env:
      INPUT_ID: download-url-input
      INPUT_LABEL: Download URL
- inputText: ${URL}
- runFlow: _dismiss-keyboard.yaml
- runFlow:
    when:
      true: ${typeof SIGNATURE !== 'undefined' && SIGNATURE != ''}
    commands:
      - runFlow:
          file: _tap-input.yaml
          env:
            INPUT_ID: signature-input
            INPUT_LABEL: Signature
      - inputText: ${SIGNATURE}
      - runFlow: _dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      text: "Download Bundle"
- tapOn: "Download Bundle"
- runFlow:
    when:
      true: ${typeof ERROR !== 'undefined' && ERROR != ''}
    commands:
      - extendedWaitUntil:
          visible: ${ERROR}
          timeout: 30000
