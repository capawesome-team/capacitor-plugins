appId: com.example.plugin
name: Download a bundle via the form and expect an error toast
env:
  BUNDLE_ID: test-bundle
  URL: http://localhost:8000/bundle.zip
  CHECKSUM: ""
  SIGNATURE: ""
  ERROR: ".*"
---
- launchApp
- extendedWaitUntil:
    visible: "Capacitor Live Update"
    timeout: 10000
- tapOn: "Bundle ID"
- inputText: ${BUNDLE_ID}
- runFlow: _dismiss-keyboard.yaml
- runFlow:
    when:
      true: ${CHECKSUM != ''}
    commands:
      - scrollUntilVisible:
          element:
            text: "Checksum"
      - tapOn: "Checksum"
      - inputText: ${CHECKSUM}
      - runFlow: _dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      text: "Download URL"
- tapOn: "Download URL"
- inputText: ${URL}
- runFlow: _dismiss-keyboard.yaml
- runFlow:
    when:
      true: ${SIGNATURE != ''}
    commands:
      - scrollUntilVisible:
          element:
            text: "Signature"
      - tapOn: "Signature"
      - inputText: ${SIGNATURE}
      - runFlow: _dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      text: "Download Bundle"
- tapOn: "Download Bundle"
- extendedWaitUntil:
    visible: ${ERROR}
    timeout: 30000
