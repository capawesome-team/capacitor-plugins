name: Release

on:
  push:
    branches:
      - main
    paths:
      - .changeset/**
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write # Required for OIDC
  issues: read
  pull-requests: write

env:
  NODE_VERSION: 24
  JAVA_VERSION: 21

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'capawesome-team/capacitor-plugins'
    outputs:
      published-packages: ${{ steps.changesets.outputs['published-packages'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Dependencies
        run: npm ci
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          version-script: npm run changeset:version
          commit-message: "chore(release): publish"
          pr-title: "chore(release): publish"
      - name: Set npm token for GitHub Packages
        if: ${{ !cancelled() && steps.changesets.outputs.published == 'true' }}
        run: npm config set //npm.pkg.github.com/:_authToken ${{ secrets.PAT }}
      - name: Publish Sponsorware to GitHub Packages
        if: ${{ !cancelled() && steps.changesets.outputs.published == 'true' }}
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs['published-packages'] }}
        run: node ./scripts/publish-sponsorware.mjs --packages="$PUBLISHED_PACKAGES"
  publish-live-update-maven-central:
    name: Publish Live Update to Maven Central
    runs-on: ubuntu-latest
    needs: release
    if: contains(needs.release.outputs.published-packages, '"@capawesome/capacitor-live-update"')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Dependencies
        run: npm ci
      - name: Publish
        working-directory: packages/live-update/android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral -PmavenCentralPublishing --no-daemon
